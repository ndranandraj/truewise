name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint + unit/integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Pytest (unit + integration + validation/diff)
        run: pytest

  js:
    name: JavaScript tests (no built site needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Component and page-state tests
        run: |
          node tests/components_smoke.js
          node tests/table_smoke.js
          node tests/ui_smoke.js
          node tests/profile_smoke.js
          node tests/value_check_states.js
          node tests/k12_compare_states.js
          node tests/careers_states.js
          node tests/layout_shot_smoke.js
          node tests/layout_enlarged_smoke.js

  section-links:
    name: Section links in Linux browsers (builds two pages, publishes nothing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm ci
          npx playwright install --with-deps chromium firefox
      - name: Build the two pages the check walks
        run: python -m tests.build_sectnav_fixture
      # The same check also blocks the deploy, on the full build. This one answers on the pull request,
      # because text measures differently on Linux and the deploy job is too late to find that out.
      - name: Section links by keyboard
        run: node tests/sectnav_focus.js --out sectnav-focus
      - name: Keep the section-links report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sectnav-focus
          path: sectnav-focus/
          retention-days: 14

  package:
    name: Build + test truewise-data package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the package from source
        run: pip install ./packages/truewise-data pytest
      - name: Test the package (installed, not editable, verifies bundled data ships)
        run: pytest packages/truewise-data/tests -q
