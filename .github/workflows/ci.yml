name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint + unit/integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Pytest (unit + integration + validation/diff)
        run: pytest

  js:
    name: JavaScript tests (no built site needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Component and page-state tests
        run: |
          node tests/components_smoke.js
          node tests/table_smoke.js
          node tests/ui_smoke.js
          node tests/profile_smoke.js
          node tests/value_check_states.js
          node tests/k12_compare_states.js

  package:
    name: Build + test truewise-data package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the package from source
        run: pip install ./packages/truewise-data pytest
      - name: Test the package (installed, not editable, verifies bundled data ships)
        run: pytest packages/truewise-data/tests -q
