name: FVT Monitor

# Monthly refresh: pull ED's latest Scorecard data, rebuild Value Check, and commit a
# dated snapshot so the FVT/GE Monitor accumulates a diffable history ED does not keep.
on:
  schedule:
    - cron: "0 12 8 * *"   # 08th of each month, 12:00 UTC
  workflow_dispatch: {}     # allow manual runs

permissions:
  contents: write           # to commit the snapshot + summary back to the repo
  issues: write             # to raise an issue when a monthly refresh fails

concurrency:
  group: fvt-monitor
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download latest Scorecard data (network)
        run: python -m pipeline.download

      - name: Build spine + Value Check + package data
        run: |
          python -m pipeline.build_spine
          python -m pipeline.value_check
          python -m pipeline.build_package_data

      - name: Refresh Careers demand layer (best-effort; BLS/NCES URLs can drift)
        run: |
          python -m pipeline.download_bls && python -m pipeline.build_careers_demand \
            || echo "Careers demand refresh skipped (source unavailable); wages unaffected."

      - name: Data-quality gate (fails the run on a bad refresh)
        run: python -m analysis.validate

      - name: Diff against the previous snapshot (skips on the first run)
        run: python -m pipeline.monitor_diff || echo "No prior snapshot yet, diff skipped."

      - name: Refresh the committed parquet build-source
        run: |
          cp data/parquet/value_check.parquet data/parquet/institutions.parquet published/
          cp data/parquet/careers_demand.parquet published/ 2>/dev/null || true

      - name: Commit snapshot + parquet source + package data if changed
        run: |
          git config user.name "truewise-bot"
          git config user.email "actions@users.noreply.github.com"
          git add archive/ published/ packages/truewise-data/truewise_data/data
          if git diff --cached --quiet; then
            echo "No changes this run."
          else
            git commit -m "FVT Monitor: refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      # A monthly job that fails quietly is a monitor that has stopped monitoring. The 2026-09-08
      # run failed on a 403 and nobody was told; the last archived snapshot is 2026-07-14, so the
      # 2026-08-08 run very likely failed the same way and went equally unnoticed. The whole point
      # of this job is to accumulate a history ED does not keep, and for two months it accumulated
      # nothing. A failure now opens an issue, so silence means success rather than absence.
      - name: Report a failed refresh
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `FVT Monitor: refresh failed ${today}`,
              labels: ['monitor'],
              body: [
                `The monthly Scorecard refresh failed. Run: ${run}`,
                '',
                'Most likely causes, in order:',
                '- **403 on the data home.** A client block. The downloader identifies itself as',
                '  `TruewiseDataRefresh/1.0`; check whether the host is refusing that agent or this',
                '  address. Do not work around it by impersonating a browser.',
                '- **Download link not found.** ED changed the page layout; update `BULK_FILES`.',
                '- **Data-quality gate failed.** A real problem with the new release. Read the gate',
                '  output before republishing anything.',
                '',
                'No snapshot was archived, so the Monitor has a gap for this month.',
              ].join('\n'),
            });
