name: FVT Monitor

# Monthly integrity and freshness check over what is COMMITTED. No network, no download, no commit.
#
# This job used to fetch ED's bulk files, rebuild, and push a dated snapshot. It cannot. A GitHub
# runner is refused with 403 by both collegescorecard.ed.gov and ed-public-download.scorecard.network,
# measured by `pipeline.reachability_probe` on 2026-09-13 rather than inferred. The refusal is not
# about identity: an agent naming the project, the site and the repository is refused exactly as the
# default one was, and the same code from a home network succeeds. Both responses came from
# CloudFront, so both hosts sit behind that CDN and both reject the runner; whether that is one
# distribution or two configured alike is not established and is not claimed.
#
# A scheduled job that cannot do its stated job is worse than no schedule, because it looks like
# coverage. So the job's stated job changed. It now verifies the archive, the published checksums,
# the agreement between what the site claims and what is archived, and the data-quality gate, and it
# reports how old ED's release is. Refreshing the data is a manual step: `make refresh`.
#
# Permissions reflect that: it reads the repository and writes issues. It no longer needs to commit.

on:
  schedule:
    - cron: "0 12 8 * *"   # 8th of each month, 12:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: fvt-monitor
  cancel-in-progress: false

env:
  ISSUE_TITLE: "FVT Monitor: the committed data needs attention"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check integrity and freshness
        id: check
        run: |
          set +e
          python -m pipeline.monitor_check --json monitor.json --markdown monitor.md
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Publish the report in the run summary
        if: always()
        run: cat monitor.md >> "$GITHUB_STEP_SUMMARY" || echo "no report produced"

      # One issue, reused. A monthly job that opens a fresh issue each time turns a single unresolved
      # problem into a pile, and the pile is then ignored as a matter of routine.
      - name: Open or update the single monitor issue
        if: steps.check.outputs.status != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("monitor.md", "utf8")
              + `\n\n<sub>Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`
              + `/actions/runs/${context.runId}</sub>\n`;
            const title = process.env.ISSUE_TITLE;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "monitor", per_page: 100,
            });
            const existing = open.data.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
              core.notice(`Updated issue #${existing.number} rather than opening a duplicate.`);
            } else {
              const made = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["monitor"],
              });
              core.notice(`Opened issue #${made.data.number}.`);
            }

      # Closing on a pass is what makes the issue trustworthy: it tracks the current state rather
      # than accumulating a record of every month something was once wrong.
      - name: Close the monitor issue once the check passes
        if: steps.check.outputs.status == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const title = process.env.ISSUE_TITLE;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "monitor", per_page: 100,
            });
            for (const issue of open.data.filter((i) => i.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: "Resolved: the monthly check passed. Closing automatically.",
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: "closed",
              });
              core.notice(`Closed issue #${issue.number}.`);
            }

      # The diff runs only when there are two genuinely different snapshots to compare. Today there
      # is one, so this is skipped and says so. Diffing a file against itself would print "no change",
      # which is true, worthless, and indistinguishable from a real comparison.
      - name: Historical diff, when two distinct snapshots exist
        if: always()
        run: |
          python - <<'PY'
          import json, sys
          report = json.load(open("monitor.json"))
          ready = next(f for f in report["findings"] if f["name"] == "historical diff is available")
          if not ready["ok"]:
              print(f"Skipped: {ready['detail']}")
              sys.exit(0)
          import subprocess
          sys.exit(subprocess.call([sys.executable, "-m", "pipeline.monitor_diff"]))
          PY

      - name: Fail the run when the check found something
        if: steps.check.outputs.status != '0'
        run: |
          echo "The monitor reported a finding; see the summary and the monitor issue." >&2
          exit 1
